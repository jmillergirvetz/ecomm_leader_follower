    join_type: always_left
    on_sql: ${analytics_prod_coco_demo__oi_atl_2026_sv__order_items.user_id} =
      ${analytics_prod_coco_demo__oi_atl_2026_sv__users.id}
    relationship_type: many_to_one

  - join_from_view: analytics_prod_coco_demo__oi_atl_2026_sv__products
    join_to_view: analytics_prod_coco_demo__oi_atl_2026_sv__distribution_centers
    join_type: always_left
    on_sql: ${analytics_prod_coco_demo__oi_atl_2026_sv__products.distribution_center_id}
      = ${analytics_prod_coco_demo__oi_atl_2026_sv__distribution_centers.id}
    relationship_type: many_to_one

  - join_from_view: analytics_prod_coco_demo__oi_atl_2026_sv__order_items
    join_to_view: analytics_prod_coco_demo__oi_atl_2026_sv__user_lifetime_facts
    join_type: always_left
    on_sql: ${analytics_prod_coco_demo__oi_atl_2026_sv__order_items.user_id} =
      ${analytics_prod_coco_demo__oi_atl_2026_sv__user_lifetime_facts.user_id}
    relationship_type: many_to_one

  - join_from_view: analytics_prod_coco_demo__oi_atl_2026_sv__order_items
    join_to_view: analytics_prod_coco_demo__oi_atl_2026_sv__order_facts
    join_type: always_left
    on_sql: ${analytics_prod_coco_demo__oi_atl_2026_sv__order_items.order_id} =
      ${analytics_prod_coco_demo__oi_atl_2026_sv__order_facts.order_id}
    relationship_type: many_to_one

ai_context: |
  This is an ecommerce analytics topic for a direct-to-consumer (DTC) retail business selling apparel, accessories, and lifestyle products. The primary fact table is order_items (one row per line item in an order).

  **Entity relationships:**
  - Users are customers who register and place orders
  - Orders contain one or more line items (order_items)
  - Each line item links to an inventory item, which links to a product in the catalog
  - Products belong to brands, categories, and departments
  - Products are stocked in distribution centers

  **Key business metrics and how to find them:**
  - Revenue → order_items.total_revenue (sum of sale_price)
  - Profit/margin → order_items.total_margin or order_items.gross_margin_pct
  - Average order value (AOV) → order_facts.avg_order_revenue (TRUE AOV at order grain, NOT order_items.avg_order_value which is line-item level)
  - Customer lifetime value → user_lifetime_facts.lifetime_revenue or user_lifetime_facts.avg_customer_ltv
  - Return rate → order_items.return_rate
  - Basket size → order_facts.avg_items_per_order or order_facts.order_size_bucket
  - Shipping performance → order_items.avg_time_to_ship or order_items.shipping_speed
  - Customer count → users.customer_count
  - Inventory health → inventory_items.sell_through_rate or inventory_items.avg_days_in_inventory

  **Important disambiguation:**
  - "AOV" should use order_facts.avg_order_revenue (order-grain, accurate) not order_items.avg_order_value (line-item grain, inflated)
  - "Revenue" means order_items.total_revenue unless the user specifies completed/returned/net
  - "Customers" queries should include users.customer_count or user_lifetime_facts.customer_count
  - "New customers" = customer_lifecycle_stage = 'One-Time Buyer' or customer_tenure_at_purchase = 'New (0-1 months)'
  - "Returning/repeat customers" = user_lifetime_facts.is_repeat_customer = TRUE
  - "Product category" is on inventory_items (not products) for transaction-level analysis

  **When to use each query view:**
  - user_lifetime_facts: For customer-level aggregates (LTV, frequency, recency, segmentation). One row per customer.
  - order_facts: For order-level aggregates (true AOV, basket size, order margin). One row per order.

  **Seasonality & trends:** Use order_items.created_at with date granularity (month, week, quarter) for trend analysis. order_day_of_week for day-of-week patterns.

