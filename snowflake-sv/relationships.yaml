- join_from_view: analytics_prod_coco_demo__user_lifetime_facts
  join_to_view: analytics_prod_coco_demo__users
  join_type: always_left
  on_sql: ${analytics_prod_coco_demo__user_lifetime_facts.user_id} =
    ${analytics_prod_coco_demo__users.id}
  relationship_type: assumed_many_to_one

- join_from_view: analytics_prod_coco_demo__events
  join_to_view: analytics_prod_coco_demo__users
  join_type: always_left
  on_sql: ${analytics_prod_coco_demo__events.user_id} =
    ${analytics_prod_coco_demo__users.id}
  relationship_type: assumed_many_to_one

- join_from_view: analytics_prod_coco_demo__inventory_items
  join_to_view: analytics_prod_coco_demo__products
  join_type: always_left
  on_sql: ${analytics_prod_coco_demo__inventory_items.product_id} =
    ${analytics_prod_coco_demo__products.id}
  relationship_type: assumed_many_to_one

- join_from_view: analytics_prod_coco_demo__order_items
  join_to_view: analytics_prod_coco_demo__users
  join_type: always_left
  on_sql: ${analytics_prod_coco_demo__order_items.user_id} =
    ${analytics_prod_coco_demo__users.id}
  relationship_type: assumed_many_to_one

- join_from_view: analytics_prod_coco_demo__order_items
  join_to_view: analytics_prod_coco_demo__inventory_items
  join_type: always_left
  on_sql: ${analytics_prod_coco_demo__order_items.inventory_item_id} =
    ${analytics_prod_coco_demo__inventory_items.id}
  relationship_type: assumed_many_to_one

- join_from_view: analytics_prod_coco_demo__products
  join_to_view: analytics_prod_coco_demo__distribution_centers
  join_type: always_left
  on_sql: ${analytics_prod_coco_demo__products.distribution_center_id} =
    ${analytics_prod_coco_demo__distribution_centers.id}
  relationship_type: assumed_many_to_one
