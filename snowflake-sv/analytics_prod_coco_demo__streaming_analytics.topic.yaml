# Topic is generated from the semantic view ANALYTICS_PROD.COCO_DEMO.STREAMING_ANALYTICS
semantic_view: ANALYTICS_PROD.COCO_DEMO.STREAMING_ANALYTICS
label: Streaming Analytics
description: |
  Podcast streaming analytics: user listening behavior, engagement, drop-off rates, and content performance. Covers streams (listen events with completion data), podcasts (content catalog), and users (listener profiles and churn).

views:
  analytics_prod_coco_demo__streaming_analytics__podcasts:
    label: Podcasts
    description: Podcast catalog — one row per show with metadata and ratings

    catalog: ANALYTICS_PROD
    schema: COCO_DEMO
    table_name: PODCASTS

    dimensions:
      avg_episode_length_min:
        sql: '"AVG_EPISODE_LENGTH_MIN"'
        description: Average duration of episodes in minutes

      episode_count:
        sql: '"EPISODE_COUNT"'
        description: Total episodes published for this podcast

      rating:
        sql: '"RATING"'
        description: User rating (1-5 scale)

      subscriber_count:
        sql: '"SUBSCRIBER_COUNT"'
        description: Number of subscribers to this podcast

      genre:
        sql: '"GENRE"'
        description: Primary content category
        synonyms: [ category, type ]

      host_name:
        sql: '"HOST_NAME"'
        description: Primary host of the podcast
        synonyms: [ creator, host ]

      language:
        sql: '"LANGUAGE"'
        description: Podcast language

      launch_date:
        sql: '"LAUNCH_DATE"'
        description: When the podcast first published

      network:
        sql: '"NETWORK"'
        description: Podcast network or publisher
        synonyms: [ label, publisher ]

      podcast_id:
        sql: '"PODCAST_ID"'
        description: Unique podcast identifier

      status:
        sql: '"STATUS"'
        description: active or inactive

      sub_genre:
        sql: '"SUB_GENRE"'
        description: Secondary content category

      title:
        sql: '"TITLE"'
        description: Podcast show name
        synonyms: [ podcast name, show name ]

    measures:
      avg_rating:
        sql: AVG(${analytics_prod_coco_demo__streaming_analytics__podcasts.rating})
        description: Average user rating across podcasts (1-5 scale)
        synonyms: [ average score, content quality ]

      total_episodes_in_catalog:
        sql: COALESCE(SUM(${analytics_prod_coco_demo__streaming_analytics__podcasts.episode_count}),
          0)
        description: Sum of all episodes across all podcasts — total content inventory
        synonyms: [ catalog episodes, total content ]

      total_podcasts:
        sql: COUNT(*)
        description: Count of distinct podcast shows in the catalog
        synonyms: [ catalog size, show count ]

      total_subscribers:
        sql: COALESCE(SUM(${analytics_prod_coco_demo__streaming_analytics__podcasts.subscriber_count}),
          0)
        description: Sum of all podcast subscriber counts — measures catalog reach
        synonyms: [ subscriber base, total subs ]

  analytics_prod_coco_demo__streaming_analytics__streams:
    label: Streams
    description: One row per user-episode listen event with completion and context data

    catalog: ANALYTICS_PROD
    schema: COCO_DEMO
    table_name: STREAMS

    dimensions:
      completion_pct:
        sql: '"COMPLETION_PCT"'
        description: Percentage of the episode the user completed (0-100)

      episode_length_min:
        sql: '"EPISODE_LENGTH_MIN"'
        description: Total duration of the episode in minutes

      is_bounce:
        sql: ${analytics_prod_coco_demo__streaming_analytics__streams.completion_pct} <
          25
        description: Stream where user dropped off before 25% of the episode
        hidden: true

      is_completed:
        sql: ${analytics_prod_coco_demo__streaming_analytics__streams.completion_pct} >=
          90
        description: Stream where user listened to 90%+ of the episode
        hidden: true

      is_downloaded:
        sql: '"DOWNLOADED" = TRUE'
        description: Episode was downloaded for offline listening
        hidden: true

      listened_min:
        sql: '"LISTENED_MIN"'
        description: How many minutes the user actually listened

      completion_bucket:
        sql: CASE WHEN
          ${analytics_prod_coco_demo__streaming_analytics__streams.completion_pct}
          >= 90 THEN 'Completed (90%+)' WHEN
          ${analytics_prod_coco_demo__streaming_analytics__streams.completion_pct}
          >= 50 THEN 'Partial (50-89%)' WHEN
          ${analytics_prod_coco_demo__streaming_analytics__streams.completion_pct}
          >= 25 THEN 'Early Drop-off (25-49%)' ELSE 'Bounced (<25%)' END
        description: Listener engagement tier based on how much of the episode was consumed
        synonyms: [ drop-off bucket, engagement tier ]

      episode_id:
        sql: '"EPISODE_ID"'
        description: Episode identifier

      listening_context:
        sql: '"LISTENING_CONTEXT"'
        description: "Where the user was listening: commute, workout, home, work, other"
        synonyms: [ context, session type ]

      podcast_title:
        sql: '"PODCAST_TITLE"'
        description: Title of the podcast being streamed
        synonyms: [ podcast name, show name ]

      started_at:
        sql: '"STARTED_AT"'
        description: Timestamp when the user began the stream

      stream_id:
        sql: '"STREAM_ID"'
        description: Unique stream event identifier

      podcast_id:
        sql: '"PODCAST_ID"'
        hidden: true

      user_id:
        sql: '"USER_ID"'
        hidden: true

    measures:
      avg_completion_rate:
        sql: AVG(${analytics_prod_coco_demo__streaming_analytics__streams.completion_pct})
        description: Average % of episode completed per stream — core engagement metric
        synonyms: [ completion rate, listen-through rate ]

      avg_listened_minutes:
        sql: AVG(${analytics_prod_coco_demo__streaming_analytics__streams.listened_min})
        description: Average minutes listened per stream — indicates session depth
        synonyms: [ average session length, avg listen time ]

      bounced_streams:
        sql: COUNT(CASE WHEN
          ${analytics_prod_coco_demo__streaming_analytics__streams.completion_pct}
          < 25 THEN 1 ELSE NULL END)
        description: Streams where the user dropped off before 25% — indicates content
          or UX issues
        synonyms: [ abandoned, drop-offs, early exits ]

      completed_streams:
        sql: COUNT(CASE WHEN
          ${analytics_prod_coco_demo__streaming_analytics__streams.completion_pct}
          >= 90 THEN 1 ELSE NULL END)
        description: Streams where the user listened to 90%+ of the episode
        synonyms: [ finished listens, full listens ]

      download_streams:
        sql: COUNT(CASE WHEN "DOWNLOADED" = TRUE THEN 1 ELSE NULL END)
        description: Streams that were downloaded for offline listening

      total_listened_minutes:
        sql: COALESCE(SUM(${analytics_prod_coco_demo__streaming_analytics__streams.listened_min}),
          0)
        description: Sum of all minutes listened across all streams
        synonyms: [ listening time, minutes played, total listen time ]

      total_streams:
        sql: COUNT(*)
        description: Total number of stream events (one per user-episode listen)
        synonyms: [ listens, plays, stream count ]

      unique_listeners:
        sql: COUNT(DISTINCT
          ${analytics_prod_coco_demo__streaming_analytics__streams.user_id})
        description: Distinct users who streamed at least once in the period
        synonyms: [ active listeners, DAU, MAU, unique users ]

      unique_podcasts_played:
        sql: COUNT(DISTINCT
          ${analytics_prod_coco_demo__streaming_analytics__streams.podcast_id})
        description: Number of distinct podcasts streamed — measures catalog breadth
          engagement

    filters:
      is_bounce__filter:
        type: boolean
        label: Is Bounce
        group_label: Filters
        description: Stream where user dropped off before 25% of the episode
        bind_to: [ is_bounce ]

      is_completed__filter:
        type: boolean
        label: Is Completed
        group_label: Filters
        description: Stream where user listened to 90%+ of the episode
        bind_to: [ is_completed ]

      is_downloaded__filter:
        type: boolean
        label: Is Downloaded
        group_label: Filters
        description: Episode was downloaded for offline listening
        bind_to: [ is_downloaded ]

  analytics_prod_coco_demo__streaming_analytics__users:
    label: Users
    description: Listener profiles with subscription tier, demographics, and churn data

    catalog: ANALYTICS_PROD
    schema: COCO_DEMO
    table_name: USERS

    dimensions:
      city:
        sql: '"CITY"'
        description: User city

      country:
        sql: '"COUNTRY"'
        description: User country
        synonyms: [ location, region ]

      gender:
        sql: '"GENDER"'
        description: User gender

    measures:
      count:
        aggregate_type: count

    filters:
      is_active__filter:
        type: boolean
        label: Is Active
        group_label: Filters
        description: User currently has an active subscription

      is_churned__filter:
        type: boolean
        label: Is Churned
        group_label: Filters
        description: User has canceled their subscription

relationships:
  - join_from_view: analytics_prod_coco_demo__streaming_analytics__streams
    join_to_view: analytics_prod_coco_demo__streaming_analytics__podcasts
    join_type: always_left
    on_sql: ${analytics_prod_coco_demo__streaming_analytics__streams.podcast_id} =
      ${analytics_prod_coco_demo__streaming_analytics__podcasts.podcast_id}
    relationship_type: many_to_one

  - join_from_view: analytics_prod_coco_demo__streaming_analytics__streams
    join_to_view: analytics_prod_coco_demo__streaming_analytics__users
    join_type: always_left
    on_sql: ${analytics_prod_coco_demo__streaming_analytics__streams.user_id} =
      ${analytics_prod_coco_demo__streaming_analytics__users.user_id}
    relationship_type: many_to_one

ai_context: |-
  Use these instructions for question categorization: Podcast streaming analytics: user listening behavior, engagement, drop-off rates, and content performance.
  KEY METRICS: 'streams' or 'listens' → total_streams; 'listening time' → total_listened_minutes; 'completion rate' → avg_completion_rate; 'drop-off' or 'bounce' → bounced_streams; 'unique listeners' → unique_listeners.
  SEGMENTATION: by genre, network, tier (free/premium/family), age_bucket, country, device_type, listening_context, completion_bucket.
  CHURN: 'churned users' → churned_users; 'churn reason' → cancel_reason; 'retention' → avg_tenure_days.
